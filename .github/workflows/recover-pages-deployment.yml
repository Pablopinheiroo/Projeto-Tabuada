name: Recover stuck GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-pages-deployment.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment and retry latest deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleSha = "b5d344b93f7d6b25e26a8de2629aa513e45d38a4";
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            try {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                { owner, repo, pages_deployment_id: staleSha }
              );
              core.info("Deploymento travado cancelado: " + staleSha);
            } catch (error) {
              if (error.status === 404) {
                core.info("O deployment antigo já não está ativo ou não existe mais.");
              } else {
                throw error;
              }
            }

            let pagesRun = null;
            const runDeadline = Date.now() + 240000;
            while (Date.now() < runDeadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: context.sha, per_page: 50
              });
              pagesRun = (data.workflow_runs || [])
                .filter(run => run.path === "dynamic/pages/pages-build-deployment" && run.head_sha === context.sha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;

              if (pagesRun && pagesRun.status === "completed") break;
              await sleep(5000);
            }

            if (!pagesRun) {
              core.setFailed("Não encontrei a execução do GitHub Pages para este commit.");
              return;
            }

            if (pagesRun.status !== "completed") {
              core.setFailed("A execução do GitHub Pages não terminou dentro do limite de verificação: " + pagesRun.html_url);
              return;
            }

            if (pagesRun.conclusion === "success") {
              core.info("GitHub Pages já publicou este commit com sucesso: " + pagesRun.html_url);
              return;
            }

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: pagesRun.id, filter: "latest", per_page: 100
            });
            const deployJob = (jobsData.jobs || []).find(job => job.name === "deploy");
            if (!deployJob || deployJob.conclusion !== "failure") {
              core.setFailed("O deploy terminou com '" + pagesRun.conclusion + "' e não encontrei um job deploy com falha para repetir. " + pagesRun.html_url);
              return;
            }

            core.info("Repetindo somente o job deploy: " + deployJob.id);
            await github.rest.actions.reRunJobForWorkflowRun({
              owner, repo, job_id: deployJob.id
            });

            const retryDeadline = Date.now() + 300000;
            let retryJob = null;
            while (Date.now() < retryDeadline) {
              const { data: latestJobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: pagesRun.id, filter: "latest", per_page: 100
              });
              retryJob = (latestJobs.jobs || []).find(job => job.name === "deploy") || null;
              if (retryJob && retryJob.status === "completed") break;
              await sleep(5000);
            }

            if (!retryJob || retryJob.status !== "completed" || retryJob.conclusion !== "success") {
              core.setFailed("A nova tentativa do deploy não concluiu com sucesso. Consulte: " + pagesRun.html_url);
              return;
            }

            core.info("Deploy do GitHub Pages concluído com sucesso após cancelar o bloqueio antigo.");
