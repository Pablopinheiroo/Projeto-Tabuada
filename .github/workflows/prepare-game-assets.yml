name: Preparar músicas e avatares do jogo
on:
  push:
    branches: [main]
    paths:
      - "tools/prepare_game_assets.py"
      - ".github/workflows/prepare-game-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-game-assets
  cancel-in-progress: false

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          python -m pip install --upgrade pip pillow
      - name: Baixar e conferir as 20 músicas e gerar GIFs
        run: python tools/prepare_game_assets.py
      - name: Salvar os arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music assets/avatars
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de arquivos."
          else
            git commit -m "Import 20 distinct free game tracks and animated avatars"
            git push
          fi
