name: Teste de interface em celular e computador
# O teste verifica a versão atual das trilhas, além das telas e controles.

on:
  push:
    branches: [main]
    paths:
      - "assets/music/**"
      - "index.html"
      - "tools/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/projeto-tabuada-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/projeto-tabuada-http.log
          exit 1

      - name: Testar catálogo, telas e controles
        run: |
          mkdir -p artifacts
          node tools/ui-smoke.mjs

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projeto-tabuada-testes-celular-computador
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
