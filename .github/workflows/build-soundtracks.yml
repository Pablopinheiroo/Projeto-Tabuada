name: Gerar trilhas sonoras do jogo
on:
  push:
    branches: [main]
    paths:
      - "tools/generate_soundtracks.py"
      - ".github/workflows/build-soundtracks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-game-soundtracks
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python e FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de áudio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip numpy

      - name: Criar 20 faixas completas
        run: python tools/generate_soundtracks.py

      - name: Salvar as faixas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music
          if git diff --cached --quiet; then
            echo "Nenhuma faixa nova para salvar."
          else
            git commit -m "Add 20 original full-length game soundtracks"
            # O trabalho pode terminar depois de outros commits na main.
            # Reaplica o commit das músicas sobre a versão mais recente antes de enviar.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
