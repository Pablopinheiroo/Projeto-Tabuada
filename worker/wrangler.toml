name = "projeto-tabuada-api"
main = "src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true

# O plano Free aplica automaticamente o limite de 50 subrequests por execução.
# Não declarar [limits]: limites personalizados são exclusivos do modelo Standard.

# Limites aproximados por localidade Cloudflare.
[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "8731001"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "LOGIN_USER_LIMITER"
namespace_id = "8731002"
[ratelimits.simple]
limit = 8
period = 60

[[ratelimits]]
name = "PROFILE_READ_LIMITER"
namespace_id = "8731003"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "PROFILE_WRITE_LIMITER"
namespace_id = "8731004"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "COMMUNITY_LIMITER"
namespace_id = "8731005"
[ratelimits.simple]
limit = 3
period = 60

[[ratelimits]]
name = "GAME_ACTION_LIMITER"
namespace_id = "8731006"
[ratelimits.simple]
limit = 12
period = 60

[triggers]
# 00:05 no horário de Brasília; garante a criação da nova temporada após 30 dias.
crons = ["5 3 * * *"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
head_sampling_rate = 0.0
persist = false

[observability.traces]
enabled = false
persist = false

[secrets]
required = ["GITHUB_TOKEN"]
